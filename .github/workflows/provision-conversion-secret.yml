name: Provision private conversion credential
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - name: Store outside web root and validate without recording a conversion
        uses: appleboy/ssh-action@v1.0.3
        env:
          OPENAI_CONVERSIONS_API_KEY: ${{ secrets.OPENAI_CONVERSIONS_API_KEY }}
        with:
          host: premium56.web-hosting.com
          username: drpaidtv
          port: 21098
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: OPENAI_CONVERSIONS_API_KEY
          script: |
            set -eu
            umask 077
            test -n "$OPENAI_CONVERSIONS_API_KEY"
            mkdir -p /home/drpaidtv/.config/lifecharge
            chmod 700 /home/drpaidtv/.config/lifecharge
            printf '%s' "$OPENAI_CONVERSIONS_API_KEY" > /home/drpaidtv/.config/lifecharge/openai-conversions.key.tmp
            chmod 600 /home/drpaidtv/.config/lifecharge/openai-conversions.key.tmp
            mv /home/drpaidtv/.config/lifecharge/openai-conversions.key.tmp /home/drpaidtv/.config/lifecharge/openai-conversions.key
            unset OPENAI_CONVERSIONS_API_KEY
            php <<'PHP'
            <?php
            $key = trim(file_get_contents('/home/drpaidtv/.config/lifecharge/openai-conversions.key'));
            $event = ['id'=>'lc_validation_only_20261108','type'=>'appointment_scheduled','timestamp_ms'=>(int)round(microtime(true)*1000),'action_source'=>'web','source_url'=>'https://lifechargechiropractic.com/','data'=>['type'=>'customer_action']];
            $curl = curl_init('https://bzr.openai.com/v1/events?pid=4jGoU3ZqHRPhPmKs7JG5xJ');
            curl_setopt_array($curl,[CURLOPT_POST=>true,CURLOPT_RETURNTRANSFER=>true,CURLOPT_TIMEOUT=>30,CURLOPT_HTTPHEADER=>['Authorization: Bearer '.$key,'Content-Type: application/json'],CURLOPT_POSTFIELDS=>json_encode(['validate_only'=>true,'events'=>[$event]])]);
            $body=curl_exec($curl); $code=curl_getinfo($curl,CURLINFO_HTTP_CODE);
            echo 'Private credential installed outside web root with mode 0600'.PHP_EOL;
            echo 'Validation-only HTTP status: '.$code.PHP_EOL;
            if ($code < 200 || $code >= 300) { echo 'Validation failed; no live event sent'.PHP_EOL; exit(1); }
            echo 'Schema/auth validation accepted; no live event recorded. Deduplication and delivery not verified.'.PHP_EOL;
            PHP
